<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="BARRIO - Encuentra productos y servicios en tu barrio. Compara precios, ve disponibilidad y ubica los locales más cercanos.">
  <meta name="theme-color" content="#FF6B35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>BARRIO - Tu barrio, más cerca</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏘️</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/styles.css?v=9">
  <style>
    /* Estilos básicos para el mensaje de error de login */
    .login-error { color: #ff0000; font-size: 0.8rem; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <div id="app">
    <div id="loadingScreen" class="loading-screen">
      <div class="splash-content">
        <div class="splash-logo">🏘️</div>
        <h1 class="splash-title">BARRIO</h1>
        <div style="font-size:1.2rem; font-weight:800; letter-spacing:4px; margin-top:-20px; margin-bottom:10px; color:var(--text-light);">PUERTO MONTT</div>
        <div style="font-size:1.8rem; margin: 10px 0 20px;">🇨🇱</div>
        <div class="splash-spinner"></div>
        <p class="splash-text">Conectando con tu barrio...</p>
      </div>
    </div>
  </div>

  <script src="/js/geo.js?v=9"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/api.js?v=10"></script>
  <script src="/js/admin.js?v=10"></script>
  
  <script>
    // --- REPARACIÓN DE ACCESO ADMINISTRADOR ---
    // Credenciales configuradas según tu solicitud
    const ADMIN_CREDENTIALS = {
      user: "admin",
      pass: "AccesoTemporal2026"
    };

    // Función global de validación (sobrescribe o complementa la lógica de admin.js si es necesario)
    window.validarAccesoAdmin = function(usuario, password) {
      if (usuario === ADMIN_CREDENTIALS.user && password === ADMIN_CREDENTIALS.pass) {
        console.log("Acceso concedido");
        localStorage.setItem('admin_session', 'active');
        return true;
      }
      return false;
    };

    // Limpieza de Service Worker para asegurar que cargue la nueva versión
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for(let reg of registrations) { reg.unregister(); console.log('SW Purged'); }
      });
    }

    // Manejador de errores global
    window.onerror = function(msg, url, line) {
      const div = document.createElement('div');
      div.style = "position:fixed;top:0;left:0;width:100%;background:red;color:white;padding:20px;z-index:10000;font-family:sans-serif;";
      div.innerHTML = "<b>⚠️ Error:</b> " + msg + "<br><small>" + url + ":" + line + "</small>";
      document.body.appendChild(div);
      const loader = document.querySelector('.loading-screen');
      if (loader) loader.style.display = 'none';
    };
  </script>
  
  <script src="/js/app.js?v=9"></script>
</body>
</html>
