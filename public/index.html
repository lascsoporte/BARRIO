<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARRIO - Bienvenido a tu Comunidad</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B35;
            --secondary: #2EC4B6;
            --bg: #F9F1E7;
            --text: #1A1A2E;
        }
        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .portal-container {
            text-align: center;
            padding: 30px;
            max-width: 450px;
            width: 90%;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), #FF2E00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
        }
        .city-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 40px;
        }
        .city-btn {
            padding: 20px;
            border-radius: 20px;
            border: 2px solid #EEE;
            background: white;
            text-decoration: none;
            color: var(--text);
            font-weight: 800;
            font-size: 1.2rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .city-btn:hover {
            border-color: var(--primary);
            background: #FFF3E0;
            transform: scale(1.02);
        }
        .city-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            grayscale: 1;
        }
        .whatsapp-section {
            border-top: 1px solid #EEE;
            padding-top: 30px;
        }
        .wa-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 24px;
            background: #25D366;
            color: white;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(37,211,102,0.3);
        }
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <h1>BARRIO</h1>
        <p>Selecciona tu ciudad para entrar a la red comunitaria.</p>
        
        <div class="city-grid">
            <a href="/app.html" class="city-btn">
                <span>📍 PUERTO MONTT</span>
                <span>🇨🇱</span>
            </a>
            <a href="#" class="city-btn disabled">
                <span>📍 OSORNO (Próximamente)</span>
                <span>🏠</span>
            </a>
        </div>

        <div class="whatsapp-section">
            <p style="font-size: 0.9rem; margin-bottom: 15px;">¿Eres comerciante? Contáctanos para figurar en la app.</p>
            <a href="https://wa.me/569XXXXXXXX" class="wa-btn">
                <span>PUERTOMAS DELIVERY</span>
            </a>
        </div>

        <div class="footer">
            &copy; 2026 PUERTOMAS SPA
        </div>
    </div>
</body>
</html>
